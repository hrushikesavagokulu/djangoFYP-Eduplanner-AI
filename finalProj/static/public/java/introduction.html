<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Java Tutorial Dashboard</title>
  <style>
    /* Reset and base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
    }

    /* Layout */
    .container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar styles */
    .sidebar {
      width: 280px;
      background: #3b3b98; /* Java-style blue/purple */
      color: #f5f6fa;
      overflow-y: auto;
      padding: 20px;
      border-right: 1px solid #2f3640;
    }

    .sidebar h2 {
      margin-bottom: 15px;
      font-size: 22px;
      text-align: center;
      border-bottom: 1px solid #2f3640;
      padding-bottom: 10px;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar ul li {
      margin-bottom: 8px;
    }

    .sidebar ul li a {
      color: #dcdde1;
      text-decoration: none;
      display: block;
      padding: 6px 10px;
      border-radius: 4px;
      transition: background 0.3s, color 0.3s;
      font-size: 14px;
    }

    .sidebar ul li a:hover,
    .sidebar ul li a.active {
      background: #9c88ff;
      color: white;
      font-weight: bold;
    }

    /* Group titles */
    .sidebar .group-title {
      margin-top: 15px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 16px;
      border-bottom: 1px solid #2f3640;
      padding-bottom: 5px;
      color: #dff9fb;
    }

    /* Main content */
    .main-content {
      flex-grow: 1;
      padding: 30px;
      overflow-y: auto;
      background: #f6e58d; /* light Java-yellow */
    }

    .main-content h1 {
      margin-top: 50px;
      margin-bottom: 20px;
      font-size: 28px;
      color: #2f3640;
    }

    .main-content p {
      font-size: 16px;
      line-height: 1.5;
      color: #2f3640;
    }
  </style>
</head>
<body>

<div class="container">
 
  <section class="main-content">
    <h1>Welcome to Java Tutorial</h1>
    <p>Select a topic from the left sidebar to get started learning Java.</p>
    <div style="margin: 40px auto; max-width: 800px; width: 90%; aspect-ratio: 16 / 9; box-shadow: 0 8px 20px rgba(0,0,0,0.2); border-radius: 12px; overflow: hidden; background: #000;">
  <iframe
    src="https://www.youtube.com/embed/bm0OyhwFDuY"
    title="Java Introduction"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
    style="width: 100%; height: 100%; border: none; display: block;"
  ></iframe>
</div>
  </section>
  

</div>

</body>
</html>
