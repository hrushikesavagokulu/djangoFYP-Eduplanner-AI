<style>

</style>


<div class="container">

<div class="sidebar">

<h3>YOUR PLANS</h3>

<div id="planTabs"></div>

</div>


<div class="main">

<div class="header">

<input type="text" id="subject" placeholder="Subject">

<input type="number" id="days" placeholder="Days">

<button onclick="generatePlan()">Generate</button>

</div>


<div id="loadingOverlay">
<div class="loading-message">
Generating plan... Please wait
</div>
</div>


<div id="planContent"></div>

</div>

</div>


<script>

/* CSRF */

function getCookie(name){

let cookieValue=null;

if(document.cookie && document.cookie!==""){

const cookies=document.cookie.split(";")

for(let i=0;i<cookies.length;i++){

const cookie=cookies[i].trim()

if(cookie.substring(0,name.length+1)===(name+"=")){

cookieValue=decodeURIComponent(cookie.substring(name.length+1))

break

}

}

}

return cookieValue

}



/* FORMAT AI CONTENT */

function formatDayContent(text){

let html=text

html=html.replace(/## Day \d+/g,"")

html=html.replace(/### Topics/g,"<h4 class='section-title'>Topics</h4>")
html=html.replace(/### Practice/g,"<h4 class='section-title'>Practice</h4>")
html=html.replace(/### Resources/g,"<h4 class='section-title'>Resources</h4>")

html=html.replace(/- (.*)/g,"<li>$1</li>")
html=html.replace(/(<li>.*<\/li>)/g,"<ul class='list'>$1</ul>")

html=html.replace(
/(https?:\/\/[^\s]+)/g,
'<a href="$1" target="_blank" class="resource-link">$1</a>'
)

return html

}



/* LOAD PLANS */

async function loadPlans(){

const res=await fetch("/csfund/plans/")
const data=await res.json()

let html=""

data.plans.forEach(p=>{

html+=`

<div class="plan-item" onclick="loadPlan(${p.id})">

<div class="plan-title">${p.subject}</div>

<button class="delete-btn"
onclick="event.stopPropagation(); deletePlan(${p.id})">

✕
</button>

</div>

`

})

document.getElementById("planTabs").innerHTML=html

}



/* DELETE PLAN */

async function deletePlan(planId){

if(!confirm("Delete this plan?")) return

await fetch(`/csfund/delete/${planId}/`,{
method:"POST",
headers:{
"X-CSRFToken":getCookie("csrftoken")
}
})

document.getElementById("planContent").innerHTML=""

loadPlans()

}



/* GENERATE PLAN */

async function generatePlan(){

const overlay=document.getElementById("loadingOverlay")

overlay.style.display="flex"

document.getElementById("planContent").innerHTML=""

const subject=document.getElementById("subject").value

const days=document.getElementById("days").value

try{

const response=await fetch("/csfund/generate/",{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded",
"X-CSRFToken":getCookie("csrftoken")
},

body:`subject=${encodeURIComponent(subject)}&days=${encodeURIComponent(days)}`

})

const reader=response.body.getReader()

const decoder=new TextDecoder()

let buffer=""

while(true){

const {done,value}=await reader.read()

if(done) break

buffer+=decoder.decode(value,{stream:true})

let lines=buffer.split("\n")

buffer=lines.pop()

for(let line of lines){

if(!line.trim()) continue

const data=JSON.parse(line)

if(data.done){

loadPlans()

continue

}

document.getElementById("planContent").innerHTML+=`

<div class="day-card">

<div class="day-header">

<h3>Day ${data.day_number}</h3>

</div>

<div class="day-body">

${formatDayContent(data.content)}

</div>

</div>

`

}

}

}catch(err){

alert("Error generating plan")

}

overlay.style.display="none"

}



/* LOAD PLAN */

async function loadPlan(planId){

const content=document.getElementById("planContent")

content.innerHTML=""

const res=await fetch(`/csfund/plan/${planId}/`)

const data=await res.json()

data.plan.forEach(day=>{

content.innerHTML+=`

<div class="day-card">

<div class="day-header">

<h3>Day ${day.day_number}</h3>

<button class="complete-btn ${day.completed?"completed":"not-completed"}"

onclick="toggleDay(${day.id},${planId})">

${day.completed?"Completed":"Mark Complete"}

</button>

</div>

<div class="day-body">

${formatDayContent(day.content)}

</div>

</div>

`

})

}



/* TOGGLE COMPLETE */

async function toggleDay(dayId,planId){

await fetch(`/csfund/day/${dayId}/toggle/`,{

method:"POST",

headers:{
"X-CSRFToken":getCookie("csrftoken")
}

})

loadPlan(planId)

}



loadPlans()

</script>

<script>
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      const cookies = document.cookie.split(";");
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === name + "=") {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  async function loadPlans() {
    const res = await fetch("/csfund/plans/");
    const data = await res.json();

    let html = "";

    data.plans.forEach((p) => {
      html += `
    <div class="plan-item" onclick="loadPlan(${p.id})">
        <div class="plan-title">
            ${p.subject}
        </div>

        <button class="delete-btn"
                onclick="event.stopPropagation(); deletePlan(${p.id})">
            ✕
        </button>
    </div>
`;
    });

    document.getElementById("planTabs").innerHTML = html;
  }

  async function deletePlan(planId) {
    const confirmDelete = confirm("Delete this plan permanently?");
    if (!confirmDelete) return;

    const res = await fetch(`/csfund/delete/${planId}/`, {
      method: "POST",
      headers: {
        "X-CSRFToken": getCookie("csrftoken"),
      },
    });

    if (res.ok) {
      document.getElementById("planContent").innerHTML = "";
      loadPlans();
    } else {
      alert("Failed to delete plan");
    }
  }
async function generatePlan() {
    const overlay = document.getElementById("loadingOverlay");
    overlay.style.display = "flex";  // Show loading
    document.getElementById("planContent").innerHTML = "";

    const subject = document.getElementById("subject").value;
    const days = document.getElementById("days").value;

    try {
        const response = await fetch("/csfund/generate/", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": getCookie("csrftoken"),
            },
            body: `subject=${encodeURIComponent(subject)}&days=${encodeURIComponent(days)}`,
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            let lines = buffer.split("\n");
            buffer = lines.pop(); // keep incomplete line

            for (let line of lines) {
                if (!line.trim()) continue;
                const data = JSON.parse(line);

                if (data.done) {
                    loadPlans();
                    continue;
                }

                document.getElementById("planContent").innerHTML += `
                    <div class="day-card">
                        <h3>Day ${data.day_number}</h3>
                        <div>${data.content}</div>
                    </div>
                `;
            }
        }

        // Parse remaining buffer
        if (buffer.trim()) {
            const data = JSON.parse(buffer);
            if (!data.done) {
                document.getElementById("planContent").innerHTML += `
                    <div class="day-card">
                        <h3>Day ${data.day_number}</h3>
                        <div>${data.content}</div>
                    </div>
                `;
            }
        }
    } catch (err) {
        alert("Error generating plan");
    } finally {
        overlay.style.display = "none";  // Hide loading
    }
}


  async function toggleDay(dayId, planId) {
    await fetch(`/csfund/day/${dayId}/toggle/`, {
      method: "POST",
      headers: { "X-CSRFToken": getCookie("csrftoken") },
    });
    loadPlan(planId);
  }

  async function loadPlan(planId) {
    const content = document.getElementById("planContent");
    content.innerHTML = "";

    try {
      const res = await fetch(`/csfund/plan/${planId}/`);

      if (!res.ok) {
        content.innerHTML = "<p style='color:red'>Failed to load plan</p>";
        return;
      }

      const data = await res.json();

      if (!data.plan || data.plan.length === 0) {
        content.innerHTML = "<p>No days found in this plan.</p>";
        return;
      }

      data.plan.forEach((day) => {
        content.innerHTML += `
    <div class="day-card ${day.completed ? "card-complete" : ""}">
        <h3>Day ${day.day_number}</h3>

        <div class="plan-text">
            ${day.content}
        </div>

        <button class="complete-btn ${day.completed ? "completed" : "not-completed"}"
                onclick="toggleDay(${day.id}, ${planId})">
            ${day.completed ? "Completed ✅" : "Mark Complete"}
        </button>
    </div>
`;
      });
    } catch (err) {
      content.innerHTML = "<p style='color:red'>Error loading plan.</p>";
    }
  }

  loadPlans();
</script>
