
{% extends "base.html" %}
{% block title %}Login – DSA Planner{% endblock %}

{% block content %}
<div style="max-width:420px; margin:60px auto; background:white;
            padding:35px; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,0.1);">

    <h2 style="margin-bottom:24px; color:#222;">🔐 Login</h2>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <label style="font-size:14px; color:#444;">Username</label><br>
        <input type="text" name="username" required
               style="width:100%; padding:10px; margin:6px 0 16px;
                      border:1px solid #ccc; border-radius:5px; font-size:15px;">

        <label style="font-size:14px; color:#444;">Password</label><br>
        <input type="password" name="password" required
               style="width:100%; padding:10px; margin:6px 0 20px;
                      border:1px solid #ccc; border-radius:5px; font-size:15px;">

        <button type="submit"
                style="width:100%; padding:11px; background:#007bff; color:white;
                       border:none; border-radius:5px; font-size:16px; cursor:pointer;">
            Login
        </button>
    </form>

    <p style="margin-top:18px; font-size:14px; color:#555; text-align:center;">
        Don't have an account?
        <a href="{% url 'register' %}" style="color:#007bff;">Register</a>
    </p>
</div>
{% endblock %}
