{% extends "base.html" %}
{% block title %}Mock Test – DSA Planner{% endblock %}

{% block extra_style %}
<style>

.mock-wrapper{
    max-width:700px;
    margin:40px auto;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    color:white;
}

.mock-wrapper h2{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:none;
    outline:none;
}

.start-btn{
    margin-top:10px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#8e2de2,#4a00e0);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.start-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(0,0,0,.4);
}

</style>
{% endblock %}

{% block content %}

<div class="mock-wrapper">

<h2>📝 Start Mock Test</h2>

<form method="POST">
{% csrf_token %}

<div class="form-group">
<label>Test Name</label>
<input type="text" name="test_name" placeholder="Enter test name">
</div>

<div class="form-group">
<label>Difficulty</label>
<select name="difficulty">
<option value="easy">Easy</option>
<option value="medium">Medium</option>
<option value="hard">Hard</option>
</select>
</div>

<div class="form-group">
<label>Number of Questions</label>
<input type="number" name="questions" min="1" max="50" value="10">
</div>

<div class="form-group">
<label>Time Limit (minutes)</label>
<input type="number" name="time" min="5" max="120" value="30">
</div>

<button type="submit" class="start-btn">🚀 Start Test</button>

</form>

</div>

{% endblock %}
