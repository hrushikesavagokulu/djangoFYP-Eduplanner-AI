{% extends "base.html" %}

{% block title %}Scheduler Progress{% endblock %}

{% block content %}
<div class="progress-wrapper">
    <h1>📊 Learning Analytics</h1>

    <!-- Stats cards -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Bar chart -->
    <div class="charts" id="chartsGrid"></div>

    <!-- Pie charts -->
    <div class="pie-charts-grid" id="pieChartsGrid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
async function loadProgress() {
    const res = await fetch("/api/scheduler-progress/");
    const data = await res.json();

    const statsGrid = document.getElementById("statsGrid");
    statsGrid.innerHTML = "";

    // Generate stats cards
    data.plans.forEach(plan => {
        const card = document.createElement("div");
        card.className = "stat-card";
        card.innerHTML = `
            <h3>${plan.name}</h3>
            <p>${plan.percent}%</p>
        `;
        statsGrid.appendChild(card);
    });

    // Bar chart for all plans
    const ctxBar = document.createElement("canvas");
    const chartsGrid = document.getElementById("chartsGrid");
    chartsGrid.innerHTML = ""; // reset
    chartsGrid.appendChild(ctxBar);

    new Chart(ctxBar, {
        type: "bar",
        data: {
            labels: data.plans.map(p => p.name),
            datasets: [{
                label: "Completion %",
                data: data.plans.map(p => p.percent),
                backgroundColor: data.plans.map(() => "rgba(34, 197, 94, 0.8)"),
                borderRadius: 8,
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, max: 100 } }
        }
    });

    // Pie charts per plan
    const pieGrid = document.getElementById("pieChartsGrid");
    pieGrid.innerHTML = "";

    data.plans.forEach(plan => {
        const pieWrapper = document.createElement("div");
        pieWrapper.className = "pie-card";
        const canvas = document.createElement("canvas");
        pieWrapper.appendChild(canvas);
        pieGrid.appendChild(pieWrapper);

        new Chart(canvas, {
            type: "pie",
            data: {
                labels: ["Completed", "Remaining"],
                datasets: [{
                    data: [plan.percent, 100 - plan.percent],
                    backgroundColor: ["#22c55e", "#e5e7eb"]
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } }
            }
        });
    });
}

loadProgress();
</script>

<style>
.progress-wrapper { padding: 40px; max-width: 1200px; margin: auto; }
h1 { font-size: 28px; color: #1f2937; margin-bottom: 30px; text-align:center; }

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 50px;
}

.stat-card {
    background: #fff;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.stat-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.12); }
.stat-card h3 { font-size: 14px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
.stat-card p { font-size: 32px; font-weight: 700; margin-top: 10px; color: #111827; }

.charts { margin-bottom: 50px; }
.charts canvas { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }

.pie-charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 25px;
}
.pie-card {
    background: #fff;
    padding: 15px;
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.pie-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.12); }
canvas { max-width: 100% !important; }
</style>
{% endblock %}
